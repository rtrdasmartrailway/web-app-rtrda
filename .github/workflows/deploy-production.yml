name: Deploy rtrda.or.th production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to deploy (blank = pushed SHA / latest origin/main)"
        required: false
        type: string

concurrency:
  group: web-app-rtrda-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main SHA to cloud primary and rtrda02 fallback
    runs-on:
      - self-hosted
      - linux
      - x64
      - rtrda-web-test

    steps:
      - name: Resolve production SHA from main
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ref || '' }}
        run: |
          set -euo pipefail
          SOURCE_PATH=/srv/workspace/web-app-rtrda-production-source
          if [ ! -d "$SOURCE_PATH/.git" ]; then
            git clone https://github.com/rtrdasmartrailway/web-app-rtrda.git "$SOURCE_PATH"
          fi
          cd "$SOURCE_PATH"
          git fetch origin main --prune
          if [ -n "$INPUT_REF" ]; then
            DEPLOY_SHA="$(git rev-parse "$INPUT_REF")"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            DEPLOY_SHA="${GITHUB_SHA}"
          else
            DEPLOY_SHA="$(git rev-parse origin/main)"
          fi
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE_PATH" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: $DEPLOY_SHA"

      - name: Prepare clean production source checkout
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          git fetch origin main test --prune
          git checkout --detach "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"
          git clean -fdx
          git status -sb
          git log --oneline -1

      - name: Install dependencies and generate Prisma client
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          DATABASE_URL: postgresql://rtrda:***@localhost:5432/build
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          npm ci
          npx prisma generate

      - name: Run validation gates
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          npm test
          npm run lint
          npm run typecheck
          npm run format:check
          npm run security:audit

      - name: Deploy exact main SHA to cloud primary
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          GITHUB_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          chmod +x .github/scripts/deploy-preprod-target.sh
          SOURCE_PATH="$SOURCE_PATH" \
          TARGET_NAME=cloud \
          TARGET_HOST=100.77.64.92 \
          TARGET_USER=ubuntu \
          TARGET_PATH=/home/ubuntu/rtrda-preprod/web-app-rtrda \
          SSH_KEY=/home/rtrda-dgt/.ssh/rtrda-cloud-preprod-sync_ed25519 \
          COMPOSE_FILE=docker-compose.preprod-cloud.yml \
          APP_SERVICE=web-app-rtrda-preprod-cloud \
          DB_SERVICE=db-preprod-cloud \
          DB_HOST_PORT=5436 \
          DIRECT_HEALTH_URL=http://100.77.64.92:3021/healthz \
          .github/scripts/deploy-preprod-target.sh

      - name: Deploy exact main SHA to rtrda02 fallback
        env:
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
          GITHUB_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          chmod +x .github/scripts/deploy-preprod-target.sh
          SOURCE_PATH="$SOURCE_PATH" \
          TARGET_NAME=rtrda02 \
          TARGET_HOST=100.91.174.121 \
          TARGET_USER=rtrda \
          TARGET_PATH=/srv/apps/web-app-rtrda-preprod-rtrda02 \
          SSH_KEY=/home/rtrda-dgt/.ssh/rtrda02_prod_preview_sync_ed25519 \
          COMPOSE_FILE=docker-compose.preprod-rtrda02.yml \
          APP_SERVICE=web-app-rtrda-preprod-rtrda02 \
          DB_SERVICE=db-preprod-rtrda02 \
          DB_HOST_PORT=5437 \
          DIRECT_HEALTH_URL=http://100.91.174.121:3021/healthz \
          .github/scripts/deploy-preprod-target.sh

      - name: Verify production parity and public health
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          SOURCE_PATH: ${{ steps.resolve.outputs.source_path }}
        run: |
          set -euo pipefail
          cloud_sha=$(ssh -i ~/.ssh/rtrda-cloud-preprod-sync_ed25519 -o BatchMode=yes ubuntu@100.77.64.92 'cd /home/ubuntu/rtrda-preprod/web-app-rtrda && git rev-parse HEAD && cat .deploy-state/preprod-release')
          rtrda02_sha=$(ssh -i ~/.ssh/rtrda02_prod_preview_sync_ed25519 -o BatchMode=yes rtrda@100.91.174.121 'cd /srv/apps/web-app-rtrda-preprod-rtrda02 && git rev-parse HEAD && cat .deploy-state/preprod-release')
          printf 'cloud_sha=%s\n' "$cloud_sha"
          printf 'rtrda02_sha=%s\n' "$rtrda02_sha"
          test "$(printf '%s\n' "$cloud_sha" | sort -u | wc -l)" -eq 1
          test "$(printf '%s\n' "$rtrda02_sha" | sort -u | wc -l)" -eq 1
          test "$(printf '%s\n' "$cloud_sha" | head -1)" = "$DEPLOY_SHA"
          test "$(printf '%s\n' "$rtrda02_sha" | head -1)" = "$DEPLOY_SHA"
          curl -fsS http://100.77.64.92:3021/healthz
          curl -fsS http://100.91.174.121:3021/healthz
          curl -fsS https://rtrda.or.th/healthz
          curl -fsS https://www.rtrda.or.th/healthz
          node "$SOURCE_PATH/scripts/check-live-security.mjs" https://rtrda.or.th
          node "$SOURCE_PATH/scripts/check-live-security.mjs" https://www.rtrda.or.th
          ssh -i ~/.ssh/rtrda02_prod_preview_sync_ed25519 -o BatchMode=yes rtrda@100.91.174.121 '/home/rtrda/bin/rtrda-production-watchdog.py --status'
