name: Deploy test.rtrda.or.th

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: web-app-rtrda-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy test site
    runs-on:
      - self-hosted
      - linux
      - x64
      - rtrda-web-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep mirrored uploads between runs so the WordPress import is
          # incremental instead of re-downloading ~4 GB every deploy.
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start database and apply migrations
        run: |
          docker compose up -d db
          # Wait for Postgres to accept connections before migrating.
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U rtrda -d rtrda >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          npm run db:migrate

      - name: Seed database from content manifest
        run: npm run db:seed

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build and restart Docker Compose service
        run: docker compose up -d --build web-app-rtrda-test

      - name: Wait for local health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3020 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=120 web-app-rtrda-test
          exit 1

      - name: Sync mirrored assets to production-preview host
        run: |
          set -euo pipefail
          rsync -az --info=stats2             -e "ssh -i ~/.ssh/rtrda02_prod_preview_sync_ed25519 -o StrictHostKeyChecking=accept-new"             public/wp-content/uploads/             rtrda@100.91.174.121:/srv/apps/web-app-rtrda/public/wp-content/uploads/
          rsync -az --info=stats2             -e "ssh -i ~/.ssh/rtrda02_prod_preview_sync_ed25519 -o StrictHostKeyChecking=accept-new"             public/sdc-downloads/             rtrda@100.91.174.121:/srv/apps/web-app-rtrda/public/sdc-downloads/

      - name: Purge Cloudflare edge cache (optional)
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # Without these secrets the deploy relies on the s-maxage we set
          # in next.config.ts (60s edge TTL, 300s SWR). With them we issue
          # a "purge everything" so the deploy is visible immediately.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN/ZONE_ID secrets set; relying on TTL (deploys visible within ~5 min)."
            exit 0
          fi
          echo "Purging Cloudflare cache for zone $CLOUDFLARE_ZONE_ID"
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | tee /tmp/cf-purge.json
          grep -q '"success":\s*true' /tmp/cf-purge.json || {
            echo "::warning::Cloudflare purge did not report success; deploy will be visible once the edge TTL expires."
          }

  deploy-prod-preview:
    name: Deploy prod-preview.rtrda.or.th
    needs: deploy
    runs-on:
      - self-hosted
      - rtrda-web-prod-preview

    steps:
      - name: Resolve deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          git fetch origin test --prune
          DEPLOY_SHA="${GITHUB_SHA}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/test
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: $DEPLOY_SHA"

      - name: Refuse dirty production-preview worktree
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::/srv/apps/web-app-rtrda has uncommitted or untracked files; refusing deploy."
            git status --short
            exit 1
          fi

      - name: Update production-preview checkout
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          git fetch origin test --prune
          git checkout -B test "$DEPLOY_SHA"
          git status -sb
          git log --oneline -1

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          npm ci

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          npx prisma generate

      - name: Start preview database and apply migrations
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          docker compose -f docker-compose.preview.yml up -d db-preview
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.preview.yml exec -T db-preview pg_isready -U rtrda -d rtrda >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          npm run db:migrate

      - name: Seed production-preview database
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          npm run db:seed

      - name: Run validation gates
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          npm test
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Build and restart production-preview Docker Compose service
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          cd /srv/apps/web-app-rtrda
          export RTRDA_IMAGE="web-app-rtrda:prod-preview-${DEPLOY_SHA}"
          docker compose -f docker-compose.preview.yml up -d --build web-app-rtrda-preview
          mkdir -p /srv/apps/web-app-rtrda-deploy-state
          echo "$DEPLOY_SHA" > /srv/apps/web-app-rtrda-deploy-state/release
          printf '%s %s\n' "$(date -Is)" "$DEPLOY_SHA" >> /srv/apps/web-app-rtrda-deploy-state/releases.log

      - name: Wait for local preview health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://100.91.174.121:3020/healthz; then
              exit 0
            fi
            sleep 3
          done
          cd /srv/apps/web-app-rtrda
          docker compose -f docker-compose.preview.yml ps
          docker compose -f docker-compose.preview.yml logs --tail=160 web-app-rtrda-preview
          exit 1

      - name: Verify public preview health check
        run: |
          set -euo pipefail
          curl -fsS https://prod-preview.rtrda.or.th/healthz
          curl -fsSI https://prod-preview.rtrda.or.th/ | sed -n '1,20p'
