name: Deploy test.rtrda.or.th

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: web-app-rtrda-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy test site on rtrda-dgt
    runs-on:
      - self-hosted
      - linux
      - x64
      - rtrda-web-test

    steps:
      - name: Refuse dirty test worktree
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::/srv/workspace/web-app-rtrda has uncommitted or untracked files; refusing deploy. Commit/stash team work before deploying test."
            git status --short
            exit 1
          fi

      - name: Update DGT test checkout to pushed test SHA
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          git fetch origin test --prune
          git checkout -B test "${GITHUB_SHA}"
          git status -sb
          git log --oneline -1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm ci

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npx prisma generate

      - name: Start database and apply migrations
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          docker compose up -d db
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U rtrda -d rtrda >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          npm run db:migrate

      - name: Seed database from content manifest
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm run db:seed

      - name: Run validation gates
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm test
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Build and restart Docker Compose service
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          docker compose up -d --build web-app-rtrda-test

      - name: Wait for local and public health checks
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3020/healthz; then
              break
            fi
            sleep 3
          done
          curl -fsS https://test.rtrda.or.th/healthz
          curl -fsSI https://test.rtrda.or.th/ | sed -n '1,20p'
