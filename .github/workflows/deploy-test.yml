name: Deploy test.rtrda.or.th

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-app-rtrda-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy test site
    runs-on:
      - self-hosted
      - linux
      - x64
      - rtrda-web-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep mirrored uploads between runs so the WordPress import is
          # incremental instead of re-downloading ~4 GB every deploy.
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start database and apply migrations
        run: |
          docker compose up -d db
          # Wait for Postgres to accept connections before migrating.
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U rtrda -d rtrda >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          npm run db:migrate

      - name: Seed database from content manifest
        run: npm run db:seed

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build and restart Docker Compose service
        run: docker compose up -d --build web-app-rtrda-test

      - name: Wait for local health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3020 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=120 web-app-rtrda-test
          exit 1
