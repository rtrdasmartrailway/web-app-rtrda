name: Deploy test.rtrda.or.th

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: web-app-rtrda-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy test site on rtrda-dgt
    runs-on:
      - self-hosted
      - linux
      - x64
      - rtrda-web-test

    steps:
      - name: Refuse dirty test worktree
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::/srv/workspace/web-app-rtrda has uncommitted or untracked files; refusing deploy. Commit/stash team work before deploying test."
            git status --short
            exit 1
          fi

      - name: Update DGT test checkout to pushed test SHA
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          git fetch origin test --prune
          git checkout -B test "${GITHUB_SHA}"
          git status -sb
          git log --oneline -1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm ci

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npx prisma generate

      - name: Start database and apply migrations
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          docker compose up -d db
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U rtrda -d rtrda >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          npm run db:migrate

      - name: Seed database from content manifest
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm run db:seed

      - name: Run validation gates
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          npm test
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Build and restart Docker Compose service
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          docker compose up -d --build web-app-rtrda-test

      - name: Wait for local and public health checks
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3020/healthz; then
              break
            fi
            sleep 3
          done
          curl -fsS https://test.rtrda.or.th/healthz
          curl -fsSI https://test.rtrda.or.th/ | sed -n '1,20p'

      - name: Deploy exact test SHA to redundant pre-prod targets
        run: |
          set -euo pipefail
          cd /srv/workspace/web-app-rtrda
          chmod +x .github/scripts/deploy-preprod-target.sh

          TARGET_NAME=cloud \
          TARGET_HOST=100.77.64.92 \
          TARGET_USER=ubuntu \
          TARGET_PATH=/home/ubuntu/rtrda-preprod/web-app-rtrda \
          SSH_KEY=/home/rtrda-dgt/.ssh/rtrda-cloud-preprod-sync_ed25519 \
          COMPOSE_FILE=docker-compose.preprod-cloud.yml \
          APP_SERVICE=web-app-rtrda-preprod-cloud \
          DB_SERVICE=db-preprod-cloud \
          DB_HOST_PORT=5436 \
          DIRECT_HEALTH_URL=http://100.77.64.92:3021/healthz \
          .github/scripts/deploy-preprod-target.sh

          TARGET_NAME=rtrda02 \
          TARGET_HOST=100.91.174.121 \
          TARGET_USER=rtrda \
          TARGET_PATH=/srv/apps/web-app-rtrda-preprod-rtrda02 \
          SSH_KEY=/home/rtrda-dgt/.ssh/rtrda02_prod_preview_sync_ed25519 \
          COMPOSE_FILE=docker-compose.preprod-rtrda02.yml \
          APP_SERVICE=web-app-rtrda-preprod-rtrda02 \
          DB_SERVICE=db-preprod-rtrda02 \
          DB_HOST_PORT=5437 \
          DIRECT_HEALTH_URL=http://100.91.174.121:3021/healthz \
          .github/scripts/deploy-preprod-target.sh

          cloud_sha=$(ssh -i ~/.ssh/rtrda-cloud-preprod-sync_ed25519 -o BatchMode=yes ubuntu@100.77.64.92 'cd /home/ubuntu/rtrda-preprod/web-app-rtrda && git rev-parse HEAD && cat .deploy-state/preprod-release')
          rtrda02_sha=$(ssh -i ~/.ssh/rtrda02_prod_preview_sync_ed25519 -o BatchMode=yes rtrda@100.91.174.121 'cd /srv/apps/web-app-rtrda-preprod-rtrda02 && git rev-parse HEAD && cat .deploy-state/preprod-release')
          printf 'cloud_sha=%s\n' "$cloud_sha"
          printf 'rtrda02_sha=%s\n' "$rtrda02_sha"
          test "$(printf '%s\n' "$cloud_sha" | sort -u | wc -l)" -eq 1
          test "$(printf '%s\n' "$rtrda02_sha" | sort -u | wc -l)" -eq 1
          test "$(printf '%s\n' "$cloud_sha" | head -1)" = "${GITHUB_SHA}"
          test "$(printf '%s\n' "$rtrda02_sha" | head -1)" = "${GITHUB_SHA}"
          curl -fsS https://pre-prod.rtrda.or.th/healthz

      - name: Purge Cloudflare edge cache (optional)
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN/ZONE_ID secrets set; relying on TTL."
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | tee /tmp/cf-purge.json
          grep -q '"success":\s*true' /tmp/cf-purge.json || {
            echo "::warning::Cloudflare purge did not report success; deploy will be visible once edge TTL expires."
          }
