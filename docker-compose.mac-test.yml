services:
  web-app-rtrda-test-mac:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-app-rtrda:test-mac-fallback-prodsource
    container_name: web-app-rtrda-test-mac
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SITE_ORIGIN: https://test.rtrda.or.th
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    depends_on:
      db-test-mac:
        condition: service_healthy
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - rtrda-test-mac-uploads:/app/public/wp-content/uploads:ro
      - rtrda-test-mac-downloads:/app/public/sdc-downloads:ro
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-test-mac:
    image: postgres:17-alpine
    container_name: web-app-rtrda-db-test-mac
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtrda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rtrda
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - rtrda-test-mac-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtrda -d rtrda"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rtrda-test-mac-db:
    name: rtrda-test-mac-db
  rtrda-test-mac-uploads:
    name: rtrda-test-mac-uploads
  rtrda-test-mac-downloads:
    name: rtrda-test-mac-downloads
