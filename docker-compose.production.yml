# Production runtime for rtrda.or.th. This can run beside prod-preview.
# Defaults keep the app local to Tailscale until Cloudflare DNS/tunnel cutover.
services:
  web-app-rtrda-production:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RTRDA_IMAGE:-web-app-rtrda:production}
    container_name: web-app-rtrda-production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SITE_ORIGIN: ${SITE_ORIGIN:-https://rtrda.or.th}
      DATABASE_URL: postgresql://rtrda:${POSTGRES_PASSWORD}@db-production:5432/rtrda
    depends_on:
      db-production:
        condition: service_healthy
    ports:
      - "${RTRDA_WEB_BIND_IP:-100.91.174.121}:${RTRDA_WEB_PORT:-3030}:3000"
    volumes:
      - ${RTRDA_UPLOADS_PATH:-/srv/apps/web-app-rtrda/public/wp-content/uploads}:/app/public/wp-content/uploads:ro
      - ${RTRDA_DOWNLOADS_PATH:-/srv/apps/web-app-rtrda/public/sdc-downloads}:/app/public/sdc-downloads:ro
    group_add:
      - "${RTRDA_ASSET_GID:-1002}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-production:
    image: postgres:17-alpine
    container_name: web-app-rtrda-db-production
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtrda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rtrda
    ports:
      - "${RTRDA_DB_BIND_IP:-127.0.0.1}:${RTRDA_DB_PORT:-5434}:5432"
    volumes:
      - rtrda-production-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtrda -d rtrda"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rtrda-production-db-data:
    name: rtrda-production-db-data
