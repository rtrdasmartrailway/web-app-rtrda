services:
  web-app-rtrda-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-app-rtrda:test
    container_name: web-app-rtrda-test
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Public origin for canonical URLs/sitemap; also defaulted in code.
      SITE_ORIGIN: https://test.rtrda.or.th
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      # Mirrored WordPress assets live on the host (imported by
      # `npm run import:wordpress`), keeping the image small and deploys
      # from re-downloading gigabytes from the source site.
      - ./public/wp-content/uploads:/app/public/wp-content/uploads:ro
      - ./public/sdc-downloads:/app/public/sdc-downloads:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
