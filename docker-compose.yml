services:
  web-app-rtrda-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-app-rtrda:test
    container_name: web-app-rtrda-test
    restart: unless-stopped
    labels:
      org.opencontainers.image.revision: ${RTRDA_RELEASE_SHA:-unknown}
    env_file:
      - /srv/workspace/Capcha.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Public origin for canonical URLs/sitemap; also defaulted in code.
      SITE_ORIGIN: https://test.rtrda.or.th
      ANALYTICS_ENV: test
      SURVEY_GOOGLE_TOKEN_FILE: /run/secrets/survey-google-token.json
      SURVEY_DASHBOARD_PASSWORD_FILE: /run/secrets/survey-dashboard-password
      ANALYTICS_HASH_SALT: ${ANALYTICS_HASH_SALT:?ANALYTICS_HASH_SALT is required}
      DATABASE_URL: postgresql://rtrda:${POSTGRES_PASSWORD}@db:5432/rtrda
    depends_on:
      db:
        condition: service_healthy
      pr-center-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      # Mirrored WordPress assets live on the host (imported by
      # `npm run import:wordpress`), keeping the image small and deploys
      # from re-downloading gigabytes from the source site.
      - ./public/wp-content/uploads:/app/public/wp-content/uploads:ro
      - ./public/sdc-downloads:/app/public/sdc-downloads:ro
      - ./private-documents:/app/private-documents:ro
      - /home/rtrda-dgt/.config/rtrda/survey-google-token.json:/run/secrets/survey-google-token.json:ro
      - /home/rtrda-dgt/.config/rtrda/survey-dashboard-password:/run/secrets/survey-dashboard-password:ro
    # Host gid of the `workspace` group that owns the mounted asset dirs
    # (mode 2770), so the in-container user can read them.
    group_add:
      - "1009"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  clamav:
    image: clamav/clamav:1.4
    container_name: web-app-rtrda-clamav-test
    restart: unless-stopped
    mem_limit: 5g
    volumes:
      - clamav-db-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  pr-center-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: pr-center-api
    image: web-app-rtrda:pr-center-api-test
    container_name: web-app-rtrda-pr-center-api-test
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rtrda:${POSTGRES_PASSWORD}@db:5432/rtrda
      SITE_ORIGIN: https://test.rtrda.or.th
      PR_CENTER_API_HOST: 0.0.0.0
      PR_CENTER_API_PORT: 3100
      PR_CENTER_EMAIL_ONLY_ENABLED: "true"
      PR_CENTER_EMAIL_ENABLED: ${PR_CENTER_EMAIL_ENABLED:-false}
      PR_CENTER_EMAIL_ONLY_ALLOWLIST: nattapol.y@rtrda.or.th,panissa.t@rtrda.or.th
      PR_CENTER_OUTBOX_WORKER_URL: http://pr-center-outbox-worker:3101/readyz
      PR_CENTER_CLAMD_HOST: clamav
      PR_CENTER_CLAMD_PORT: "3310"
      ENTRA_ENV_FILE: /run/secrets/rtrda.env
      PR_CENTER_FILE_DIR: /var/lib/pr-center/files
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - /srv/workspace/rtrda.env:/run/secrets/rtrda.env:ro
      - pr-center-file-data:/var/lib/pr-center/files
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:3100/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pr-center-outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: pr-center-api
    image: web-app-rtrda:pr-center-api-test
    container_name: web-app-rtrda-pr-center-outbox-worker-test
    restart: unless-stopped
    command: ["npm", "run", "pr-center:outbox-worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      PR_CENTER_OUTBOX_WORKER_PORT: "3101"
      PR_CENTER_SMTP_HOST: ${PR_CENTER_SMTP_HOST:-}
      PR_CENTER_SMTP_PORT: ${PR_CENTER_SMTP_PORT:-587}
      PR_CENTER_SMTP_SECURE: ${PR_CENTER_SMTP_SECURE:-false}
      PR_CENTER_SMTP_USER: ${PR_CENTER_SMTP_USER:-}
      PR_CENTER_SMTP_FROM: ${PR_CENTER_SMTP_FROM:-}
      PR_CENTER_SMTP_PASSWORD_FILE: /run/secrets/pr-center-smtp-password
      PR_CENTER_EMAIL_ONLY_ALLOWLIST: nattapol.y@rtrda.or.th,panissa.t@rtrda.or.th
    volumes:
      - ${PR_CENTER_SMTP_PASSWORD_HOST_FILE:-/dev/null}:/run/secrets/pr-center-smtp-password:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3101/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: web-app-rtrda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtrda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rtrda
    ports:
      # Host access for prisma migrate / db:seed / ad-hoc content edits.
      - "127.0.0.1:5432:5432"
    volumes:
      - rtrda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtrda -d rtrda"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rtrda-db-data:
    # Fixed name so every compose checkout (local + CI runner) shares the data.
    name: rtrda-db-data
  clamav-db-data:
    name: rtrda-test-clamav-db
  pr-center-file-data:
    name: rtrda-test-pr-center-file-data
